<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peach</title>
<meta name="description" content="Glute-focused training, flexible protein tracking.">
<meta name="theme-color" content="#FAF5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120E10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peach">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* -- Tokens -----------------------------------------------
   Warm cream and peach, with plum for upper-body days and
   sage for "you hit it". Neutrals lean warm so the greys
   read as linen, not as default grey. */
:root {
  --bg:        #FAF5F1;
  --surface:   #FFFFFF;
  --surface-2: #F3EBE5;
  --line:      #EADFD7;
  --ink:       #2B1D22;
  --ink-2:     #76646A;
  --ink-3:     #A3949A;
  --accent:    #E0694F;
  --accent-ink:#B9472F;
  --accent-sf: #FCE7DF;
  --btn:       #C9553D;
  --on-btn:    #FFFFFF;
  --plum:      #8A4A6B;
  --plum-sf:   #F3E3EC;
  --blue:      #3F78A6;
  --sage:      #3F7D55;
  --sage-sf:   #E1F0E5;
  --gold:      #A87510;
  --glass:     rgba(250,245,241,.72);
  --scrim:     rgba(43,29,34,.32);
  --shadow:    0 1px 2px rgba(43,29,34,.04), 0 8px 24px rgba(43,29,34,.06);
  --shadow-lg: 0 2px 6px rgba(43,29,34,.08), 0 24px 60px rgba(43,29,34,.18);
  --r:  14px;
  --r2: 22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#120E10; --surface:#1D171A; --surface-2:#282024; --line:#352B30;
    --ink:#F6EDF0; --ink-2:#B3A2A8; --ink-3:#7E6F75;
    --accent:#F28C70; --accent-ink:#F7A58E; --accent-sf:#3A2019;
    --btn:#F28C70; --on-btn:#2A120B;
    --plum:#D08AB0; --plum-sf:#33202B; --sage:#7CC493; --sage-sf:#16291C; --gold:#E4B252; --blue:#7FB3DA;
    --glass: rgba(18,14,16,.72); --scrim: rgba(0,0,0,.5);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#120E10; --surface:#1D171A; --surface-2:#282024; --line:#352B30;
  --ink:#F6EDF0; --ink-2:#B3A2A8; --ink-3:#7E6F75;
  --accent:#F28C70; --accent-ink:#F7A58E; --accent-sf:#3A2019;
  --btn:#F28C70; --on-btn:#2A120B;
  --plum:#D08AB0; --plum-sf:#33202B; --sage:#7CC493; --sage-sf:#16291C; --gold:#E4B252; --blue:#7FB3DA;
  --glass: rgba(18,14,16,.72); --scrim: rgba(0,0,0,.5);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
.num, .rnd { font-family: ui-rounded, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }

/* -- Layout ---------------------------------------------- */
#main {
  max-width: 560px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px);
}
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }
h1 { font-size: 34px; line-height: 1.08; letter-spacing: -0.025em; font-weight: 750; margin: 4px 0 18px; }
h2 { font-size: 22px; line-height: 1.15; letter-spacing: -0.015em; font-weight: 700; margin: 0; }
h3 { font-size: 17px; line-height: 1.25; letter-spacing: -0.01em; font-weight: 650; margin: 0; }
.sub { color: var(--ink-2); font-size: 15px; }
.tiny { color: var(--ink-3); font-size: 13px; }
.sec { margin: 26px 4px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec h2 { font-size: 20px; }
.link { color: var(--accent-ink); font-weight: 600; font-size: 15px; }

.card {
  background: var(--surface); border-radius: var(--r2); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 12px;
}
.card.flat { box-shadow: none; background: var(--surface-2); }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 10px; }

/* Press feedback lives on pointer-down and is instant */
.press { transition: transform .12s ease-out, opacity .12s ease-out; }
.press:active { transform: scale(.97); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 50px; padding: 0 22px; border-radius: 999px;
  background: var(--btn); color: var(--on-btn); font-weight: 650; font-size: 17px;
  transition: transform .12s ease-out, filter .12s;
}
.btn:active { transform: scale(.96); filter: brightness(.94); }
.btn.wide { width: 100%; }
.btn.ghost { background: var(--accent-sf); color: var(--accent-ink); }
.btn.quiet { background: var(--surface-2); color: var(--ink); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 15px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2); flex: none;
  transition: transform .12s ease-out;
}
.icon-btn:active { transform: scale(.9); }
.icon-btn.accent { background: var(--accent-sf); color: var(--accent-ink); }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px;
  border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 15px; font-weight: 550;
  box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; transition: transform .12s ease-out;
}
.chip:active { transform: scale(.95); }
.chip.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; }
.chips::-webkit-scrollbar { display: none; }

.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; position: relative; }
.seg button { flex: 1; height: 34px; border-radius: 9px; font-weight: 600; font-size: 15px; color: var(--ink-2); position: relative; z-index: 1; transition: color .2s; }
.seg button.on { color: var(--ink); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 9px; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); transition: transform .38s cubic-bezier(.25,1,.35,1); }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 650; letter-spacing: .02em; }
.pill.glute { background: var(--accent-sf); color: var(--accent-ink); }
.pill.upper { background: var(--plum-sf); color: var(--plum); }
.pill.good { background: var(--sage-sf); color: var(--sage); }

/* -- Tab bar: a translucent layer content scrolls under -- */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center;
  padding: 8px 12px calc(env(safe-area-inset-bottom) + 8px);
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
  border-top: .5px solid var(--line);
}
#tabs .inner { display: flex; width: 100%; max-width: 520px; }
#tabs button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 4px 0; transition: color .15s, transform .12s;
}
#tabs button:active { transform: scale(.92); }
#tabs button.on { color: var(--accent-ink); }
#tabs svg { width: 25px; height: 25px; }

/* -- Today ------------------------------------------------ */
.week { display: flex; justify-content: space-between; margin-top: 14px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 38px; }
.wd .l { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.wd .c {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-size: 14px; font-weight: 650; color: var(--ink-2); background: var(--surface-2);
}
.wd.done .c { background: var(--accent); color: #fff; }
.wd.today .c { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.wd .p { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.wd .p.hit { background: var(--sage); }

.hero {
  position: relative; overflow: hidden; border-radius: 28px; padding: 22px;
  background: linear-gradient(150deg, #F6A487 0%, #E0694F 55%, #B9475E 100%);
  color: #fff; box-shadow: 0 18px 40px rgba(201,85,61,.28); margin-bottom: 12px;
}
.hero.upper { background: linear-gradient(150deg, #C48AAE 0%, #8A4A6B 60%, #5E2F4C 100%); box-shadow: 0 18px 40px rgba(138,74,107,.28); }
.hero .eyebrow { color: rgba(255,255,255,.78); }
.hero h2 { font-size: 30px; letter-spacing: -0.025em; margin: 6px 0 4px; }
.hero .meta { color: rgba(255,255,255,.86); font-size: 15px; }
.hero .btn { background: #fff; color: #9C3A27; margin-top: 18px; }
.hero.upper .btn { color: var(--plum); }
.hero .blob { position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.12); }
.hero .blob.b2 { right: 40px; top: 60px; width: 120px; height: 120px; background: rgba(255,255,255,.08); }
.hero .lst { margin-top: 14px; font-size: 14px; color: rgba(255,255,255,.9); line-height: 1.6; }

.ringwrap { position: relative; flex: none; }
.ringwrap .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring-num { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.ring-lab { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--plum); transition: width .5s cubic-bezier(.25,1,.35,1); }
.mtiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.mt { background: var(--surface-2); border-radius: 14px; padding: 10px 11px 9px; min-width: 0; }
.mt .ml { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); }
.mt .mv { font-size: 19px; font-weight: 700; margin: 2px 0 6px; white-space: nowrap; }
.mt .mv small { font-size: 12px; font-weight: 550; color: var(--ink-3); }
.mt .bar { height: 6px; background: var(--line); }
.mt .ms { font-size: 12px; color: var(--ink-2); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat { font-size: 15px; color: var(--ink-2); }
.stat b { color: var(--ink); font-weight: 650; }

/* -- Lists ------------------------------------------------- */
.list { background: var(--surface); border-radius: var(--r2); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; position: relative; background: var(--surface); }
.li + .li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--line); }
.li .t { font-weight: 550; font-size: 16px; }
.li .s { font-size: 14px; color: var(--ink-2); }
.li.tap { transition: background .12s; cursor: pointer; }
.li.tap:active { background: var(--surface-2); }
.fav { color: var(--gold); }
.handle { touch-action: none; color: var(--ink-3); padding: 8px; margin: -8px; cursor: grab; display: grid; place-items: center; }
[data-sort].lifting { position: relative; z-index: 5; box-shadow: var(--shadow-lg); border-radius: 16px; transition: box-shadow .2s; }

.sess { display: flex; align-items: center; gap: 14px; }
.sess .n {
  width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none;
  font-weight: 700; font-size: 17px; background: var(--accent-sf); color: var(--accent-ink);
}
.sess.upper .n { background: var(--plum-sf); color: var(--plum); }

/* -- Logger ------------------------------------------------ */
.ex { padding: 16px; }
.ex .head { display: flex; align-items: flex-start; gap: 12px; }
.ex .tgt { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.ex .cue { font-size: 14px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin-top: 10px; line-height: 1.5; }
.ex .hint { font-size: 13px; font-weight: 600; color: var(--accent-ink); margin-top: 8px; }
.ex .last { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
.sets { margin-top: 12px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 8px; align-items: center; margin-top: 6px; }
.set .k { font-size: 13px; font-weight: 650; color: var(--ink-3); text-align: center; }
.set label { position: relative; display: block; }
.set input {
  width: 100%; height: 44px; border-radius: 12px; border: 0; background: var(--surface-2);
  text-align: center; font-size: 17px; font-weight: 600; outline: none; padding: 0 30px 0 8px;
  font-family: ui-rounded, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums;
}
.set input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.set label span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-3); pointer-events: none; }
.tick {
  width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-3); transition: transform .12s ease-out, background .2s, color .2s;
}
.tick:active { transform: scale(.88); }
.set.done input { background: var(--sage-sf); color: var(--sage); }
.set.done .tick { background: var(--sage); color: #fff; }
.colhead { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 8px; font-size: 11px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; text-align: center; margin-top: 12px; }

/* -- Push page (slides in from the right, leaves to the right) -- */
#push {
  position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: none; will-change: transform;
}
#push .bar-top {
  position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
}
#push .back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent-ink); font-size: 17px; font-weight: 500; height: 40px; padding-right: 8px; }
#push .back svg { width: 24px; height: 24px; }
#push .bar-top .ttl { flex: 1; text-align: center; font-weight: 650; font-size: 17px; opacity: 0; transition: opacity .2s; }
#push .bar-top.scrolled .ttl { opacity: 1; }
#push .bar-top.scrolled { box-shadow: 0 .5px 0 var(--line); }
#push .body { max-width: 560px; margin: 0 auto; padding: 6px 16px calc(env(safe-area-inset-bottom) + 120px); }

/* -- Sheet --------------------------------------------------- */
#scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; display: none; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; display: none;
  max-width: 560px; margin: 0 auto; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 28px 28px 0 0; box-shadow: var(--shadow-lg);
  padding: 8px 18px calc(env(safe-area-inset-bottom) + 20px); will-change: transform;
}
#sheet .grab { padding: 6px 0 14px; touch-action: none; cursor: grab; }
#sheet .grab i { display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 18px 0 8px; }
.stepper .icon-btn { width: 54px; height: 54px; }
.stepper .icon-btn svg { width: 24px; height: 24px; }
.qty { text-align: center; min-width: 120px; }
.qty .v { font-size: 52px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.qty .u { font-size: 15px; color: var(--ink-2); margin-top: 4px; }
.macro { display: flex; justify-content: center; gap: 22px; margin: 14px 0 18px; }
.macro div { text-align: center; }
.macro b { display: block; font-size: 22px; font-weight: 700; }
.macro span { font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 6px 4px; }
.field input, .field select, .field textarea {
  width: 100%; height: 48px; border-radius: 14px; border: 0; background: var(--surface-2);
  padding: 0 14px; font-size: 17px; outline: none;
}
.field textarea { height: 90px; padding: 12px 14px; resize: none; }
.field input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.search {
  display: flex; align-items: center; gap: 8px; height: 42px; border-radius: 12px; background: var(--surface-2);
  padding: 0 12px; color: var(--ink-3); margin-bottom: 12px;
}
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; color: var(--ink); min-width: 0; }

/* -- Rest timer --------------------------------------------- */
#rest {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 35;
  transform: translate(-50%, 140%); transition: transform .45s cubic-bezier(.25,1,.35,1);
  display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 18px; border-radius: 999px;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lg);
}
#rest.on { transform: translate(-50%, 0); }
#rest .clock { font-size: 22px; font-weight: 700; min-width: 58px; }
#rest .lab { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; opacity: .65; }
#rest button { height: 38px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 600; font-size: 15px; }
:root[data-theme="dark"] #rest button { background: rgba(0,0,0,.1); }

#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); z-index: 60;
  transform: translate(-50%, -160%); transition: transform .45s cubic-bezier(.25,1,.35,1);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px;
  box-shadow: var(--shadow-lg); white-space: nowrap;
}
#toast.on { transform: translate(-50%, 0); }

.spark { display: block; width: 100%; height: 60px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; position: relative; }
.bars i { flex: 1; border-radius: 4px 4px 2px 2px; background: var(--accent-sf); min-height: 3px; }
.bars i.hit { background: var(--sage); }
.bars i.today { background: var(--accent); }
.bars .goal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--ink-3); opacity: .6; }
.why li { margin-bottom: 8px; }
.why { padding-left: 20px; margin: 10px 0 0; color: var(--ink-2); font-size: 15px; }
.why b { color: var(--ink); }
.empty { text-align: center; padding: 26px 10px; color: var(--ink-3); font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  #tabs, #push .bar-top { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
</style>
</head>
<body>
<div id="main"></div>
<nav id="tabs"><div class="inner"></div></nav>
<div id="push"></div>
<div id="scrim"></div>
<div id="sheet"></div>
<div id="rest" role="status" aria-live="polite">
  <div><div class="lab">Rest</div><div class="clock num" id="rest-clock">0:00</div></div>
  <button data-act="rest-add">+30s</button>
  <button data-act="rest-skip">Skip</button>
</div>
<div id="toast"></div>

<script>
/* ===========================================================
   EXERCISES
   Glutes grow from hip extension, abduction and kickbacks.
   Squats, lunges, split squats, step-ups, leg press and leg
   extensions are left out on purpose: they load the quads,
   which is the "bigger legs" she doesn't want.

/* ===========================================================
   MOTION
   One small spring, used for the push page and the sheet.
   Critically damped by default; a touch of bounce only when
   a flick handed it momentum.
   =========================================================== */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)');
function spring(from, to, { velocity = 0, response = 0.38, damping = 1 } = {}, onUpdate, onDone) {
  if (REDUCE.matches) { onUpdate(to); onDone && onDone(); return () => {}; }
  const k = Math.pow(2 * Math.PI / response, 2), c = 4 * Math.PI * damping / response;
  let x = from, v = velocity, last = performance.now(), id;
  const frame = now => {
    const dt = Math.min(0.064, (now - last) / 1000); last = now;
    const n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n;
    for (let i = 0; i < n; i++) { const a = -k * (x - to) - c * v; v += a * h; x += v * h; }
    if (Math.abs(v) < 4 && Math.abs(x - to) < 0.4) { onUpdate(to); onDone && onDone(); return; }
    onUpdate(x); id = requestAnimationFrame(frame);
  };
  id = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(id);
}
const project = (v, d = 0.998) => (v / 1000) * d / (1 - d);

/* ===========================================================
   SHEET — drag the grabber to throw it away
   =========================================================== */
let sheetY = 0, sheetStop = null, sheetOnClose = null;
function setSheetY(y) {
  sheetY = y;
  const sh = $('#sheet'), h = sh.offsetHeight || 1;
  sh.style.transform = `translateY(${Math.max(y, -24)}px)`;
  $('#scrim').style.opacity = String(Math.max(0, Math.min(1, 1 - y / h)));
}
function openSheet(html, onMount, onClose) {
  const sh = $('#sheet');
  sh.innerHTML = '<div class="grab"><i></i></div>' + html;
  sh.style.display = 'block'; $('#scrim').style.display = 'block';
  sheetOnClose = onClose || null;
  sh.scrollTop = 0;
  const h = sh.offsetHeight;
  sheetStop && sheetStop();
  setSheetY(h);
  sheetStop = spring(h, 0, { response: 0.36 }, setSheetY);
  onMount && onMount(sh);
}
function closeSheet(velocity = 0) {
  const sh = $('#sheet'); if (sh.style.display !== 'block') return;
  sheetStop && sheetStop();
  sheetStop = spring(sheetY, sh.offsetHeight + 20, { velocity, response: 0.32 }, setSheetY, () => {
    sh.style.display = 'none'; $('#scrim').style.display = 'none'; sh.innerHTML = '';
    const cb = sheetOnClose; sheetOnClose = null; cb && cb();
  });
}
(function wireSheetDrag() {
  const sh = $('#sheet');
  let drag = null;
  sh.addEventListener('pointerdown', e => {
    const onGrab = e.target.closest('.grab') || (e.target.closest('.sheet-head') && !e.target.closest('button,input,a'));
    if (!onGrab) return;
    sheetStop && sheetStop();
    drag = { id: e.pointerId, y0: e.clientY, s0: sheetY, hist: [[e.clientY, performance.now()]] };
    sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    let y = drag.s0 + (e.clientY - drag.y0);
    if (y < 0) y = -(Math.pow(-y, 0.7));                 // rubber-band upward
    setSheetY(y);
    drag.hist.push([e.clientY, performance.now()]); if (drag.hist.length > 6) drag.hist.shift();
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const h = drag.hist, a = h[0], b = h[h.length - 1];
    const v = b[1] - a[1] > 0 ? (b[0] - a[0]) / ((b[1] - a[1]) / 1000) : 0;
    drag = null;
    const landing = sheetY + project(v, 0.99);
    if (landing > sh.offsetHeight * 0.45) closeSheet(v);
    else { sheetStop = spring(sheetY, 0, { velocity: v, response: 0.32, damping: Math.abs(v) > 300 ? 0.82 : 1 }, setSheetY); }
  };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
  $('#scrim').addEventListener('click', () => closeSheet());
})();

/* ===========================================================
   PUSH PAGE — in from the right, back out to the right
   =========================================================== */
let pushStop = null;
function openPush(view) {
  const P = $('#push');
  UI.push = view; renderPush();
  P.style.display = 'block'; P.scrollTop = 0;
  const w = window.innerWidth;
  pushStop && pushStop();
  P.style.transform = `translateX(${w}px)`;
  pushStop = spring(w, 0, { response: 0.4 }, x => P.style.transform = `translateX(${x}px)`);
}
function closePush() {
  const P = $('#push'), w = window.innerWidth;
  pushStop && pushStop();
  const cur = new DOMMatrix(getComputedStyle(P).transform).m41;   // start from what is on screen
  pushStop = spring(cur, w, { response: 0.36 }, x => P.style.transform = `translateX(${x}px)`, () => {
    P.style.display = 'none'; P.innerHTML = ''; UI.push = null; UI.editSess = false;
  });
  render();
}
$('#push').addEventListener('scroll', () => {
  const b = $('#push .bar-top'); if (b) b.classList.toggle('scrolled', $('#push').scrollTop > 40);
}, { passive: true });

/* ===========================================================
   DRAG TO REORDER — the row stays glued to the finger
   =========================================================== */
function sortable(list, onMove) {
  if (!list) return;
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('.handle'); if (!h) return;
    e.preventDefault();
    const items = [...list.querySelectorAll(':scope > [data-sort]')];
    const item = h.closest('[data-sort]'), from = items.indexOf(item);
    const rects = items.map(el => el.getBoundingClientRect());
    const gap = items.length > 1 ? rects[1].top - rects[0].bottom : 0;
    const H = rects[from].height + gap, y0 = e.clientY;
    let to = from;
    h.setPointerCapture(e.pointerId);
    item.classList.add('lifting');
    items.forEach(el => { if (el !== item) el.style.transition = 'transform .25s cubic-bezier(.25,1,.35,1)'; });
    buzz(8);
    const move = ev => {
      const dy = ev.clientY - y0;
      item.style.transform = `translateY(${dy}px) scale(1.02)`;
      const mid = rects[from].top + rects[from].height / 2 + dy;
      let t = from;
      for (let i = 0; i < items.length; i++) {
        const c = rects[i].top + rects[i].height / 2;
        if (i < from && mid < c) { t = i; break; }
        if (i > from && mid > c) t = i;
      }
      if (t !== to) { to = t; buzz(5); }
      items.forEach((el, i) => {
        if (el === item) return;
        let s = 0;
        if (from < to && i > from && i <= to) s = -H;
        if (to < from && i >= to && i < from) s = H;
        el.style.transform = s ? `translateY(${s}px)` : '';
      });
    };
    const up = () => {
      dragEnded = Date.now();
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      const off = to > from ? rects[to].bottom - rects[from].bottom : to < from ? rects[to].top - rects[from].top : 0;
      item.style.transition = 'transform .22s cubic-bezier(.25,1,.35,1)';
      item.style.transform = `translateY(${off}px)`;
      setTimeout(() => { if (to !== from) onMove(from, to); else { item.classList.remove('lifting'); items.forEach(el => { el.style.transform = ''; el.style.transition = ''; }); } }, 220);
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
}
let dragEnded = 0;   // the click that follows a drag must not open the row
const moveIn = (arr, a, b) => { const [x] = arr.splice(a, 1); arr.splice(b, 0, x); };

/* ===========================================================
   TRAINING
   =========================================================== */
const order = () => S.order[S.days];
const sess = id => S.sessions[id];
const exName = x => (EX[x] || { n: x }).n;
function estMin(s) { return Math.round(s.items.reduce((m, i) => m + i.sets * ((EX[i.x] || {}).rest || 60) + i.sets * 40, 0) / 60) + 5; }
function sessionsDone(fromKey_, toKey_) {
  let n = 0; for (const k in S.done) if (k >= fromKey_ && k <= toKey_) n += S.done[k].length; return n;
}
function lastDoneSession() {
  const keys = Object.keys(S.done).sort();
  for (let i = keys.length - 1; i >= 0; i--) { const a = S.done[keys[i]]; if (a.length) return a[a.length - 1]; }
  return null;
}
function nextSession() {
  const o = order(), last = lastDoneSession(), i = o.indexOf(last);
  return o[(i + 1) % o.length] || o[0];
}
function history(x) { return Object.entries(S.logs[x] || {}).sort((a, b) => a[0] < b[0] ? -1 : 1); }
function lastBefore(x, k) { const h = history(x).filter(([d]) => d < k); return h.length ? h[h.length - 1] : null; }
const setsText = sets => sets.map(s => (s.w ? s.w + ' × ' : '') + s.r).join(', ');
function hint(item) {
  const ex = EX[item.x] || {}; if (ex.bw && !ex.sec) return '';
  const last = lastBefore(item.x, today()); if (!last) return 'First time — pick a weight you could do a few more reps with.';
  const sets = last[1].sets, top = item.rep[1];
  if (sets.length >= item.sets && sets.every(s => +s.r >= top)) return ex.sec ? 'Hit the top — hold 10 s longer today.' : 'You hit the top of the range — add 5–10 lb today.';
  return 'Same weight, beat last time by a rep.';
}
function draftRows(item) {
  const D = S.draft; if (!D.ex[item.x]) {
    const last = lastBefore(item.x, today());
    const w = last && last[1].sets.length ? last[1].sets[last[1].sets.length - 1].w : '';
    D.ex[item.x] = Array.from({ length: item.sets }, () => ({ w: w || '', r: '', done: false }));
  }
  return D.ex[item.x];
}
function commitEx(x) {
  const rows = (S.draft.ex[x] || []).filter(r => r.done);
  const k = S.draft.date;
  S.logs[x] = S.logs[x] || {};
  if (rows.length) S.logs[x][k] = { sets: rows.map(r => ({ w: r.w === '' ? 0 : +r.w, r: +r.r })) };
  else delete S.logs[x][k];
  save();
}

/* Rest timer */
let rest = null, restTick = null;
function startRest(sec) {
  rest = { end: Date.now() + sec * 1000 }; $('#rest').classList.add('on');
  clearInterval(restTick); restTick = setInterval(paintRest, 250); paintRest();
}
function paintRest() {
  if (!rest) return;
  const left = Math.max(0, Math.round((rest.end - Date.now()) / 1000));
  $('#rest-clock').textContent = Math.floor(left / 60) + ':' + pad(left % 60);
  if (left <= 0) { buzz([120, 80, 120]); stopRest(); }
}
function stopRest() { rest = null; clearInterval(restTick); $('#rest').classList.remove('on'); }

/* ===========================================================
   FOOD
   =========================================================== */
const allFoods = () => BASE_FOODS.concat(S.foods.map(toFood));
const foodById = id => allFoods().find(f => f.id === id);
function dayFood(k) { return S.food[k] || []; }
function totals(k) {
  let p = 0, kc = 0, c = 0, fa = 0;
  dayFood(k).forEach(e => { const f = foodById(e.id); if (f) { p += f.p1 * e.q; kc += f.k1 * e.q; c += f.c1 * e.q; fa += f.f1 * e.q; } });
  return { p: Math.round(p), k: Math.round(kc), c: Math.round(c), f: Math.round(fa) };
}
/* Carbs get whatever calories are left once protein and fat are set:
   they fuel the training, so they are the flexible part of the day. */
const carbGoal = () => Math.max(50, Math.round((S.kcal - S.protein * 4 - S.fat * 9) / 4 / 5) * 5);
function macroTiles(tot) {
  const M = [['Carbs', tot.c, carbGoal(), ' g', 'var(--gold)'], ['Fat', tot.f, S.fat, ' g', 'var(--blue)'], ['Calories', tot.k, S.kcal, '', 'var(--plum)']];
  return `<div class="mtiles">${M.map(([l, v, g, u, col]) => {
    const st = v > g * 1.1 ? `<span style="color:var(--accent-ink)">${v - g}${u} over</span>`
      : v >= g * 0.9 ? `<span style="color:var(--sage)">In range ✓</span>` : `${g - v}${u} left`;
    return `<div class="mt"><div class="ml">${l}</div><div class="mv rnd">${v}<small> / ${g}${u}</small></div>
      <div class="bar"><i style="width:${Math.min(100, v / g * 100)}%;background:${col}"></i></div><div class="ms">${st}</div></div>`; }).join('')}</div>`;
}
const hitDay = k => totals(k).p >= S.protein * 0.95;
function weekProtein(k) {
  const ws = weekStart(k), days = [];
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d > today()) break; if (dayFood(d).length) days.push(totals(d).p); }
  return { avg: days.length ? Math.round(days.reduce((a, b) => a + b, 0) / days.length) : 0, n: days.length, hit: days.filter(p => p >= S.protein * 0.95).length };
}
function recentIds() {
  const seen = {}, out = [];
  Object.keys(S.food).sort().reverse().slice(0, 14).forEach(k => dayFood(k).slice().reverse().forEach(e => { if (!seen[e.id]) { seen[e.id] = 1; out.push(e.id); } }));
  return out;
}
/* Ways to close the protein gap, from what she actually eats first */
function gapIdeas(left) {
  if (left < 6) return [];
  const pool = [];
  const add = id => { const f = foodById(id); if (f && f.p1 * f.rec >= 7 && !pool.includes(f)) pool.push(f); };
  Object.keys(S.favs).forEach(add); recentIds().forEach(add);
  ['greek_yogurt','chicken','cottage','shake','turkey_deli','egg_whites','tuna','string_cheese'].forEach(add);
  return pool.slice(0, 5).map(f => {
    let q = Math.ceil(left / f.p1 / f.step) * f.step;
    q = Math.min(q, f.rec * 2); q = Math.max(q, f.step);
    return { f, q, p: Math.round(f.p1 * q), closes: f.p1 * q >= left - 1 };
  });
}

function ring(pct, size, sw, color) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" style="transition:stroke-dashoffset .7s cubic-bezier(.25,1,.35,1)"/></svg>`;
}

/* ===========================================================
   VIEWS
   =========================================================== */
function render() {
  const m = $('#main');
  m.innerHTML = UI.tab === 'today' ? vToday() : UI.tab === 'train' ? vTrain() : UI.tab === 'fuel' ? vFuel() : vProgress();
  paintTabs();
  if (UI.tab === 'train') sortable($('#plan-list'), (a, b) => { moveIn(order(), a, b); save(); render(); });
}
function paintTabs() {
  const tabs = [['today','Today'],['train','Train'],['fuel','Fuel'],['progress','Progress']];
  $('#tabs .inner').innerHTML = tabs.map(([k, l]) =>
    `<button data-act="tab" data-arg="${k}" class="${UI.tab === k ? 'on' : ''}" aria-label="${l}">${ICON[k]}<span>${l}</span></button>`).join('');
}

function greeting() { const h = new Date().getHours(); return h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening'; }

function weekStrip() {
  const ws = weekStart(today()); let out = '';
  for (let i = 0; i < 7; i++) {
    const k = addDays(ws, i), d = fromKey(k), done = (S.done[k] || []).length, isT = k === today();
    out += `<div class="wd ${done ? 'done' : ''} ${isT ? 'today' : ''}"><span class="l">${DOW[d.getDay()][0]}</span>
      <span class="c rnd">${d.getDate()}</span><span class="p ${k <= today() && hitDay(k) ? 'hit' : ''}"></span></div>`;
  }
  return out;
}

function vToday() {
  const t = today(), d = new Date(), ws = weekStart(t);
  const doneWk = sessionsDone(ws, addDays(ws, 6));
  const nid = S.draft ? S.draft.sid : nextSession(), n = sess(nid);
  const tot = totals(t), left = Math.max(0, S.protein - tot.p);
  const doneToday = (S.done[t] || []).length;
  const others = order().filter(id => id !== nid);
  return `
  <div class="eyebrow">${DAYNAME[d.getDay()]}, ${niceDate(t)}</div>
  <h1>${greeting()}, ${esc(S.name)}</h1>

  <div class="card">
    <div class="row"><div class="grow"><h3>${doneWk} of ${S.days} sessions</h3><div class="tiny">This week · dot = protein hit</div></div>
      <span class="pill ${doneWk >= S.days ? 'good' : 'glute'}">${doneWk >= S.days ? 'Week done' : (S.days - doneWk) + ' to go'}</span></div>
    <div class="week">${weekStrip()}</div>
  </div>

  ${n ? `<div class="hero ${n.kind === 'upper' ? 'upper' : ''}">
    <div class="blob"></div><div class="blob b2"></div>
    <div class="eyebrow">${S.draft ? 'In progress' : doneToday ? 'Up next time' : 'Up next'}</div>
    <h2>${esc(n.name)}</h2>
    <div class="meta">${esc(n.sub)} · ${n.items.length} exercises · ~${estMin(n)} min</div>
    <div class="lst">${n.items.slice(0, 4).map(i => esc(exName(i.x))).join(' · ')}${n.items.length > 4 ? ' · …' : ''}</div>
    <button class="btn" data-act="start" data-arg="${nid}">${S.draft ? 'Resume workout' : 'Start workout'}</button>
  </div>` : ''}
  ${!S.draft && others.length ? `<div class="tiny" style="margin:4px 4px 8px">Or do a different one today</div>
    <div class="chips">${others.map(id => `<button class="chip" data-act="start" data-arg="${id}">${esc(sess(id).name)}</button>`).join('')}</div>` : ''}

  <div class="sec"><h2>Protein today</h2><button class="link" data-act="tab" data-arg="fuel">Log food</button></div>
  <div class="card">
    <div class="row" style="gap:18px">
      <div class="ringwrap">${ring(tot.p / S.protein, 104, 11, tot.p >= S.protein ? 'var(--sage)' : 'var(--accent)')}
        <div class="mid"><div><div class="ring-num rnd">${tot.p}</div><div class="ring-lab">of ${S.protein} g</div></div></div></div>
      <div class="grow stack">
        <div class="stat">${left ? `<b>${left} g</b> protein to go` : '<b>Protein done</b> — nice'}</div>
        <div class="tiny">Protein is the one to hit. Carbs, fat and calories just need to land close.</div>
      </div>
    </div>
    ${macroTiles(tot)}
    ${gapBlock(left)}
  </div>`;
}

function gapBlock(left) {
  const ideas = gapIdeas(left); if (!ideas.length) return '';
  return `<div class="tiny" style="margin:16px 0 8px">Easy ways to close it</div>
    <div class="chips">${ideas.map(g => `<button class="chip" data-act="food" data-arg="${g.f.id}" data-q="${g.q}">${esc(serving(g.f, g.q))} ${esc(shortName(g.f))} <b style="color:var(--accent-ink)">+${g.p}g</b></button>`).join('')}</div>`;
}
const shortName = f => f.n.replace(/,.*$/, '').replace(/\s*\(.*\)$/, '').replace(/ \d+%$/, '').toLowerCase();

/* ---------- Workout ---------- */
function vWorkout() {
  const D = S.draft, s = sess(D.sid);
  const doneSets = Object.values(D.ex).reduce((n, r) => n + r.filter(x => x.done).length, 0);
  const total = s.items.reduce((n, i) => n + i.sets, 0);
  return `${topBar(s.name, 'Finish', 'finish')}

      <b class="rnd" style="color:var(--accent-ink)">${Math.round(f.p1 * e.q)} g</b></div>`; }).join('')}</div>`
    : `<div class="card flat empty">Nothing logged yet. Tap a food below — the suggested amount is already filled in.</div>`}

  <div class="sec"><h2>Add food</h2><button class="link" data-act="new-food">+ Custom</button></div>
  <div class="search">${ICON.search}<input id="food-q" type="search" placeholder="Search foods" value="${esc(UI.q)}" autocomplete="off"></div>
  <div class="chips" style="margin-bottom:12px">
    ${[['all','All'],['fav','★ Favorites'],['recent','Recent']].concat(Object.entries(CATS)).map(([c, l]) =>

    <div class="sub" style="margin-top:8px"><b style="color:var(--ink)">Carbs (~${carbGoal()} g)</b> fuel the glute workouts. Have more of them before and after training, like rice, oats, potatoes, fruit or a bagel.</div>
    <div class="sub" style="margin-top:8px"><b style="color:var(--ink)">Fat (~${S.fat} g)</b> comes easily from eggs, salmon, avocado, nuts and cheese. Try not to stay under ~45 g for long, because fat matters for hormones.</div>

function foodList() {
  const q = UI.q.trim().toLowerCase();
  let list = allFoods();
  if (UI.cat === 'fav') list = list.filter(f => S.favs[f.id]);
  else if (UI.cat === 'recent') { const r = recentIds(); list = r.map(foodById).filter(Boolean); }
  else if (UI.cat !== 'all') list = list.filter(f => f.cat === UI.cat);
  if (q) list = list.filter(f => f.n.toLowerCase().includes(q));
  if (UI.cat === 'all' && !q) list = list.slice().sort((a, b) => (S.favs[b.id] ? 1 : 0) - (S.favs[a.id] ? 1 : 0));

  return `<div class="list">${list.map(f => `
    <div class="li tap" data-act="food" data-arg="${f.id}">

        <div class="s">${esc(serving(f, f.rec))} · <b style="color:var(--accent-ink);font-weight:650">${Math.round(f.p1 * f.rec)} g protein</b> · C ${Math.round(f.c1 * f.rec)} · F ${Math.round(f.f1 * f.rec)} · ${Math.round(f.k1 * f.rec)} kcal</div></div>
      <span class="icon-btn accent">${ICON.plus}</span></div>`).join('')}</div>`;
}

/* ---------- Progress ---------- */
function spark(vals, color) {
  if (vals.length < 2) return '';
  const w = 300, h = 60, mn = Math.min(...vals), mx = Math.max(...vals), span = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - 6 - (v - mn) / span * (h - 12)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${pts.map(p => p.join(',')).join(' ')}"/></svg>`;
}
function vProgress() {
  const t = today(), bwKeys = Object.keys(S.bw).sort(), bwVals = bwKeys.map(k => S.bw[k]);
  const avg = (from, to) => { const v = bwKeys.filter(k => k >= from && k <= to).map(k => S.bw[k]); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const thisWk = avg(addDays(t, -6), t), lastWk = avg(addDays(t, -13), addDays(t, -7));
  const delta = thisWk != null && lastWk != null ? r1(thisWk - lastWk) : null;
  let bars = '';
  for (let i = 13; i >= 0; i--) { const k = addDays(t, -i), p = totals(k).p; bars += `<i class="${k === t ? 'today' : p >= S.protein * 0.95 ? 'hit' : ''}" style="height:${Math.min(100, p / (S.protein * 1.3) * 100)}%"></i>`; }
  const lifts = Object.keys(S.logs).filter(x => history(x).length && (EX[x] || {}).p !== 'activate').sort((a, b) => (GLUTE_P[(EX[b] || {}).p] ? 1 : 0) - (GLUTE_P[(EX[a] || {}).p] ? 1 : 0));
  return `
  <div class="eyebrow">Slow and steady</div>
  <h1>Progress</h1>
  <div class="card">
    <div class="row"><div class="grow"><h3>Body weight</h3><div class="tiny">Goal: up about ¼–½ lb a week</div></div>
      ${delta != null ? `<span class="pill ${delta > 0 && delta <= 0.75 ? 'good' : 'glute'}">${delta > 0 ? '+' : ''}${delta} lb / wk</span>` : ''}</div>
    <div class="row" style="margin-top:12px"><div class="grow"><div class="ring-num rnd">${bwVals.length ? bwVals[bwVals.length - 1] : S.weight}<span style="font-size:15px;color:var(--ink-3)"> lb</span></div></div>
      <input inputmode="decimal" id="bw-in" placeholder="Today" style="width:96px;height:42px;border:0;border-radius:12px;background:var(--surface-2);text-align:center;font-size:17px;outline:none" value="${S.bw[t] || ''}">
      <button class="btn sm" data-act="log-bw">Log</button></div>
    ${spark(bwVals.slice(-30), 'var(--accent)')}
    <div class="tiny" style="margin-top:6px">${delta == null ? 'Weigh in a few mornings a week — the weekly average is what matters.' :
      delta < 0.2 ? 'Flat for two weeks? Add ~150 kcal a day, mostly carbs.' : delta > 0.75 ? 'Faster than needed — pull back ~150 kcal a day.' : 'Right on track.'}</div>
  </div>

  <div class="card">
    <div class="row"><div class="grow"><h3>Protein, last 14 days</h3><div class="tiny">Green = hit · line = ${S.protein} g</div></div></div>
    <div class="bars" style="margin-top:14px"><div class="goal" style="bottom:${100 / 1.3}%"></div>${bars}</div>
  </div>

  <div class="sec"><h2>Lifts</h2></div>
  ${lifts.length ? `<div class="list">${lifts.map(x => { const h = history(x), best = h.map(([, d]) => Math.max(...d.sets.map(s => s.w || 0))), lastS = h[h.length - 1];
    return `<div class="li"><div class="grow"><div class="t">${esc(exName(x))}</div><div class="s">${niceDate(lastS[0])} · ${esc(setsText(lastS[1].sets))}</div></div>
      <div style="width:90px">${spark(best, 'var(--accent)')}</div></div>`; }).join('')}</div>`
    : `<div class="card flat empty">Finish a workout and your lifts show up here.</div>`}

  <div class="sec"><h2>Settings</h2></div>
  <div class="card">
    <div class="two"><label class="field"><span>Name</span><input data-in="set-name" value="${esc(S.name)}"></label>
      <label class="field"><span>Body weight (lb)</span><input data-in="set-weight" inputmode="decimal" value="${S.weight}"></label></div>
    <div class="two"><label class="field"><span>Protein goal (g)</span><input data-in="set-protein" inputmode="numeric" value="${S.protein}"></label>
      <label class="field"><span>Calorie goal</span><input data-in="set-kcal" inputmode="numeric" value="${S.kcal}"></label></div>
    <div class="two"><label class="field"><span>Fat goal (g)</span><input data-in="set-fat" inputmode="numeric" value="${S.fat}"></label>
      <label class="field"><span>Carbs goal (auto)</span><input value="${carbGoal()} g" disabled style="opacity:.6"></label></div>
    <div class="tiny" style="margin:-2px 4px 14px">Protein defaults to ~0.9 g per lb. Calories are a small surplus for slow, lean gain. Fat is about 25% of calories. Carbs fill in whatever calories are left.</div>
    <div class="two"><button class="btn quiet" data-act="export">Back up</button><button class="btn quiet" data-act="import">Restore</button></div>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
  </div>
  <div class="tiny" style="text-align:center;margin-top:10px">Peach · ${BUILD}</div>`;
}

function renderPush() {

let elapsedT = null;

}

    sh.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => {
      const x = el.dataset.pick, e = EX[x];
      const def = GLUTE_P[e.p] ? (e.p === 'activate' ? [2, 15, 20] : e.p === 'thrust' && !e.bw ? [3, 8, 12] : [3, 12, 15]) : [3, 10, 12];
      if (replaceIdx != null) { const old = s.items[replaceIdx]; s.items[replaceIdx] = { x, sets: old.sets, rep: old.rep.slice() }; }
      else s.items.push(it(x, def[0], def[1], def[2]));
      save(); closeSheet(); renderPush(); toast(replaceIdx != null ? 'Swapped' : 'Added');
    });
  });
}

/* ===========================================================
   EVENTS
   =========================================================== */
document.addEventListener('click', e => {
  if (e.target.closest('.handle') || Date.now() - dragEnded < 400) return;
  const el = e.target.closest('[data-act]'); if (!el || !el.dataset.act) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  switch (a) {
    case 'tab':
      if (UI.tab === arg) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      UI.tab = arg; if (arg === 'fuel') UI.fuelDay = null; render(); window.scrollTo(0, 0); break;
    case 'days': S.days = +arg; save(); render(); break;
    case 'edit-plan': UI.editPlan = !UI.editPlan; render(); break;
    case 'reset-plan':
      if (confirm('Put the plan back to the original? Your logged workouts stay.')) { S.sessions = clone(DEFAULT_SESSIONS); S.order = clone(DEFAULT_ORDER); save(); render(); toast('Plan reset'); }
      break;
    case 'open-sess': UI.editSess = false; openPush({ type:'sess', id: arg }); break;
    case 'edit-sess': UI.editSess = !UI.editSess; renderPush(); break;
    case 'edit-item': itemSheet(UI.push.id, +arg); break;
    case 'add-ex': librarySheet(UI.push.id, null, null); break;
    case 'back': closePush(); break;
    case 'start':
      if (S.draft && S.draft.sid !== arg) {
        if (!confirm('You have a workout in progress. Start a different one? Sets you ticked are already saved.')) return;
        S.draft = null;
      }
      if (!S.draft) S.draft = { sid: arg, date: today(), start: Date.now(), ex: {} };
      save(); UI.openCue = {};
      if (UI.push) { UI.push = { type:'workout' }; renderPush(); $('#push').scrollTop = 0; } else openPush({ type:'workout' });
      break;
    case 'cue': UI.openCue[arg] = !UI.openCue[arg]; renderPush(); break;
    case 'tick': {
      const rows = S.draft.ex[el.dataset.x], r = rows[+el.dataset.n];
      if (!r.done && !(+r.r > 0)) {
        const inp = document.querySelector(`[data-in="r"][data-x="${el.dataset.x}"][data-n="${el.dataset.n}"]`);
        const it_ = sess(S.draft.sid).items.find(i => i.x === el.dataset.x);
        if (inp && it_) { r.r = String(it_.rep[1]); }
      }
      r.done = !r.done; commitEx(el.dataset.x); buzz(r.done ? 18 : 8);
      if (r.done) startRest((EX[el.dataset.x] || {}).rest || 60);
      renderPush(); break;
    }
    case 'add-set': { const rows = S.draft.ex[arg]; rows.push({ w: rows.length ? rows[rows.length - 1].w : '', r: '', done: false }); save(); renderPush(); break; }
    case 'finish': {
      const D = S.draft, any = Object.values(D.ex).some(r => r.some(x => x.done));
      if (!any && !confirm('No sets ticked yet. Finish anyway?')) return;
      if (any) { S.done[D.date] = S.done[D.date] || []; S.done[D.date].push(D.sid); }
      S.draft = null; save(); stopRest(); clearInterval(elapsedT); closePush(); UI.tab = 'today'; render();
      toast(any ? 'Workout saved 🍑' : 'Closed'); break;
    }
    case 'discard':
      if (!confirm('Discard this workout? Sets you already ticked are removed too.')) return;
      Object.keys(S.draft.ex).forEach(x => { if (S.logs[x]) delete S.logs[x][S.draft.date]; });
      S.draft = null; save(); stopRest(); closePush(); break;
    case 'rest-add': if (rest) { rest.end += 30000; paintRest(); } break;
    case 'rest-skip': stopRest(); break;
    case 'food': foodSheet(arg, el.dataset.q ? +el.dataset.q : null); break;
    case 'edit-entry': { const k = UI.fuelDay || today(), en = dayFood(k)[+arg]; foodSheet(en.id, en.q, +arg); break; }
    case 'new-food': newFoodSheet(); break;
    case 'cat': UI.cat = arg; $('#food-list').innerHTML = foodList();
      document.querySelectorAll('[data-act="cat"]').forEach(b => b.classList.toggle('on', b.dataset.arg === arg)); break;
    case 'day': {
      const k = addDays(UI.fuelDay || today(), +arg); if (k > today()) return;
      UI.fuelDay = k === today() ? null : k; render(); break;
    }
    case 'log-bw': {
      const v = parseFloat($('#bw-in').value); if (!(v > 50 && v < 400)) { $('#bw-in').focus(); return; }
      S.bw[today()] = v; S.weight = v; save(); render(); toast('Logged ' + v + ' lb'); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify({ app:'peach', v:1, exported: today(), data: S }, null, 2)], { type:'application/json' });
      const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = 'peach-' + today() + '.json';
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); break;
    }
    case 'import': $('#importfile').click(); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'food-q') { UI.q = el.value; $('#food-list').innerHTML = foodList(); return; }
  const k = el.dataset.in; if (!k) return;
  if (k === 'w' || k === 'r') { const r = S.draft.ex[el.dataset.x][+el.dataset.n]; r[k] = el.value; if (r.done) commitEx(el.dataset.x); else save(); return; }
  if (k === 'sess-name') { sess(el.dataset.arg).name = el.value; save(); return; }
  if (k === 'sess-sub') { sess(el.dataset.arg).sub = el.value; save(); return; }
  if (k === 'set-name') { S.name = el.value.trim() || 'Jane'; save(); return; }
  if (k === 'set-protein') { const v = +el.value; if (v > 30) { S.protein = v; save(); } return; }
  if (k === 'set-kcal') { const v = +el.value; if (v > 800) { S.kcal = v; save(); } return; }
  if (k === 'set-fat') { const v = +el.value; if (v >= 20) { S.fat = v; save(); } return; }
  if (k === 'set-weight') { const v = +el.value; if (v > 60) { S.weight = v; S.protein = Math.round(v * 0.9 / 5) * 5; save(); } return; }
});
document.addEventListener('change', e => {
  if (['set-weight','set-kcal','set-protein','set-fat'].includes(e.target.dataset.in)) render();
  if (e.target.id === 'importfile' && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try { const d = JSON.parse(r.result); if (d.app !== 'peach' || !d.data) throw 0; S = Object.assign(S, d.data); save(); render(); toast('Backup restored'); }
      catch (err) { alert('That file is not a Peach backup.'); }
    };
    r.readAsText(e.target.files[0]);
  }
});

/* ===========================================================
   BOOT
   =========================================================== */
load();
render();
if (S.draft && S.draft.date !== today()) {           // yesterday's unfinished session: keep what was ticked, close it
  const any = Object.values(S.draft.ex).some(r => r.some(x => x.done));
  if (any) { S.done[S.draft.date] = S.done[S.draft.date] || []; S.done[S.draft.date].push(S.draft.sid); }
  S.draft = null; save(); render();
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
}
</script>
</body>
